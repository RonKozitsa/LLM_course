# Configuration for Multi-Stage Translation Quality Analysis System

# File Paths
input_files:
  english: "English.csv"
  french: "French.csv"
  hebrew: "Hebrew.csv"
  english_final: "English_final.csv"

output_files:
  results_csv: "vector_similarity_results.csv"
  averaged_csv: "vector_similarity_averaged.csv"
  visualization: "vector_similarity_vs_mistakes.png"
  comparative_results: "comparative_analysis_results.csv"
  statistical_report: "statistical_analysis_report.txt"

# Model Configuration
models:
  primary: "sentence-transformers/all-MiniLM-L6-v2"
  comparative:
    - "sentence-transformers/all-mpnet-base-v2"
    - "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    - "sentence-transformers/all-distilroberta-v1"

# Statistical Analysis Parameters
statistics:
  confidence_level: 0.95  # For confidence intervals
  alpha: 0.05  # Significance level for hypothesis testing
  min_samples_per_group: 10  # Minimum samples for statistical validity

# Visualization Settings
visualization:
  figure_size: [14, 9]
  dpi: 300
  style: "seaborn-v0_8-darkgrid"
  color_palette: "viridis"
  show_error_bars: true
  show_trend_line: true
  show_confidence_interval: true

# Data Validation
validation:
  min_mistakes: 4
  max_mistakes: 20
  expected_samples_per_mistake: 10
  expected_total_sentences: 170

# Performance Settings
performance:
  batch_size: 32
  use_gpu: false  # Set to true if GPU available
  max_workers: 4  # For parallel processing
  cache_embeddings: true

# Research Settings
research:
  run_comparative_analysis: true
  run_hypothesis_testing: true
  calculate_confidence_intervals: true
  generate_statistical_report: true
  create_jupyter_analysis: true

# Token Usage Tracking (for documentation)
token_tracking:
  enabled: false  # Set to true to track token usage
  api_model: "claude-sonnet-4"  # Model used for translation agents
  estimated_tokens_per_sentence:
    english_to_french: 150
    french_to_hebrew: 180
    hebrew_to_english: 160
